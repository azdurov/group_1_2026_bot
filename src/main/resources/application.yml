server:
  port: ${PORT:8080}

spring:
  application:
    name: group-1-bot

  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: bot-scheduler-

scheduler:
  enabled: true

  morning-weather:
    cron: ${SCHEDULER_MORNING_WEATHER_CRON:0 0 4 * * *}

  holiday:
    cron: ${SCHEDULER_HOLIDAY_CRON:0 0 6 * * *}

  quote:
    cron: ${SCHEDULER_QUOTE_CRON:0 0 7 * * *}

  joke:
    cron: ${SCHEDULER_JOKE_CRON:0 0 9 * * *}

  recipe:
    cron: ${SCHEDULER_RECIPE_CRON:0 0 14 * * *}

  evening-weather:
    cron: ${SCHEDULER_EVENING_WEATHER_CRON:0 0 15 * * *}

  reminder-scan:
    cron: ${SCHEDULER_REMINDER_SCAN_CRON:0 * 5-20 * * *}


telegram:
  bot:
    token: ${BOT_TOKEN}
    chat-id: ${CHAT_ID}
    username: ${BOT_USERNAME:@group_1_2026_bot}

  long-polling:
    enabled: true


upstash:
  url: https://driving-lizard-284070.upstash.io
  token: ${UPSTASH_REDIS_REST_TOKEN}


weather:
  location:
    latitude: 53.6712799
    longitude: 23.8659896

  open-weather:
    api-key: ${OPEN_WEATHER_API_KEY}
    api-url: https://api.openweathermap.org/data/2.5/forecast


meme:
  api-url: https://meme-api.com/gimme


joke:
  api-url: http://rzhunemogu.ru/RandJSON.aspx
  category: 1


holiday:
  api:
    url: https://date.nager.at/api/v3/PublicHolidays


recipe:
  api:
    url: https://www.themealdb.com/api/json/v1/1/random.php


cozylife:
  email: ${COZYLIFE_EMAIL}
  password: ${COZYLIFE_PASSWORD}
  api-url: https://api-eu.doiting.com/api


http:
  client:
    connect-timeout: 5s
    read-timeout: 10s


logging:
  level:
    root: INFO
    group2026: DEBUG
    org.telegram: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
